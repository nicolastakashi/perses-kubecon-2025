name: Dashboard-as-Code workflow

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - release/*
      - snapshot/*
    tags:
      - v*
  pull_request:
  merge_group:
jobs:
  dac:
    uses: perses/cli-actions/.github/workflows/dac.yaml@v0.2.0
    with:
      url: https://demo.perses.dev
      directory: ./dashboards
      server-validation: true
      cli-version: v0.51.0-beta.1 # TODO change to stable release when possible
    secrets:
      username: ${{ secrets.DAC_USR }}
      password: ${{ secrets.DAC_PSW }}